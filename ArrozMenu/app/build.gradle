plugins { id 'com.android.application' }
android {
    namespace 'com.rdzim.lucasmenu.keyauth'
    compileSdk 35
    defaultConfig {
        applicationId 'com.rdzim.lucasmenu.keyauth'
        minSdk 30
        targetSdk 35
        versionCode 39
        versionName '3.1.7'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs { originalDebug { storeFile rootProject.file('signing/test.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    buildTypes { debug { signingConfig signingConfigs.originalDebug } }
    packaging { jniLibs { useLegacyPackaging = true } }
}
dependencies { implementation 'net.i2p.crypto:eddsa:0.3.0' }
